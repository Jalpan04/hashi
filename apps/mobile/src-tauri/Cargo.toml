[package]
name = "hashi-mobile"
version.workspace = true
edition.workspace = true

[lib]
name = "hashi_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
hashi-core = { path = "../../../crates/hashi-core" }
hashi-server = { path = "../../../crates/hashi-server" }
tauri-plugin-hashi-native = { path = "../../../plugins/tauri-plugin-hashi-native" }
tauri = { workspace = true, features = ["custom-protocol"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
base64.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
