<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hashi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F6F3;--card:#fff;--line:#E6E4DF;--tx:#18181B;--mu:#76767C;--ac:#FF5A1F;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0E10;--card:#1A1A1E;--line:#2A2A2E;--tx:#F5F5F5;--mu:#8A8A90}}
:root[data-theme="dark"]{--bg:#0E0E10;--card:#1A1A1E;--line:#2A2A2E;--tx:#F5F5F5;--mu:#8A8A90}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mu)}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 8px}
h1{font-size:26px;font-weight:500;letter-spacing:-.015em;margin:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);display:grid;place-items:center;color:var(--on)}
#view{flex:1;overflow-y:auto;padding:8px 20px 24px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{height:116px;border-radius:16px;background:var(--card);padding:18px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;font-size:17px;font-weight:500;transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile.p{background:var(--ac);color:var(--on)}
.today{color:var(--mu);font-size:13px;margin:20px 4px 28px}
.lbl{color:var(--mu);font-size:12px;font-weight:500;margin:0 4px 10px}
.list{background:var(--card);border-radius:16px;padding:0 16px}
.row{display:flex;gap:12px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}
.row .ic{color:var(--mu);margin-top:2px}
.row p{margin:0;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.row.open p{-webkit-line-clamp:unset}
.row .mono{margin-top:3px}
nav{display:flex;border-top:1px solid var(--line);padding:6px 8px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--mu);font-size:11px;font-weight:500}
nav button.on{color:var(--ac)}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px}
.big{font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--ac)}
.chk{display:flex;align-items:center;gap:12px;width:100%;padding:13px 0;border-bottom:1px solid var(--line);text-align:left}
.chk:last-child{border:0}
.box{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--mu);display:grid;place-items:center;color:var(--on)}
.chk.d .box{background:var(--ac);border-color:var(--ac)}
.chk.d span:last-child{color:var(--mu);text-decoration:line-through}
.fab{position:absolute;right:20px;bottom:84px;background:var(--ac);color:var(--on);border-radius:24px;padding:13px 20px;font-weight:500}
ul.tk{margin:10px 0 0;padding-left:18px;color:var(--mu);font-size:14px}
.play{width:34px;height:34px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center;flex:none}
.aud{display:flex;align-items:center;gap:12px;margin-top:10px}
.aud .bar{flex:1;margin:0}
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:20px;z-index:5}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.sheet .go{background:var(--ac);color:var(--on);border-radius:14px;padding:15px;font-weight:500;text-align:center;margin-top:auto}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--tx);font:inherit;outline:0;margin-bottom:12px}
textarea{flex:1;resize:none}
input:focus,textarea:focus{border-color:var(--ac)}
.photo{height:200px;border-radius:16px;background:var(--card);border:1px dashed var(--mu);display:grid;place-items:center;color:var(--mu);margin-bottom:12px;overflow:hidden;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover}
.rec{width:96px;height:96px;border-radius:50%;background:var(--ac);color:var(--on);margin:auto;display:grid;place-items:center}
.rec.on{border-radius:24px;width:80px;height:80px}
.timer{font:400 44px 'JetBrains Mono',monospace;text-align:center;margin-top:40px}
.empty{color:var(--mu);text-align:center;margin-top:60px}
.day{margin:20px 4px 8px}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="ttl"></h1><div class="av" id="av"></div></header>
  <div id="view"></div>
  <nav id="nav"></nav>
</div>
<script>
var P={cam:'<path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="3.5"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',pen:'<path d="M4 20l1-4L16 5l3 3L8 19z"/>',chk:'<path d="M5 12.5l4.5 4.5L19 7"/>',home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-3 11v2h6v-2a6 6 0 00-3-11z"/>',pulse:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',book:'<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',play:'<path d="M8 5v14l11-7z" fill="currentColor"/>',pause:'<path d="M8 5v14M16 5v14"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>'};
function ic(n,s){return '<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+P[n]+'</svg>'}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function at(h,m){var d=new Date();d.setHours(h,m,0,0);return d.getTime()}
function fmt(t){return new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).toLowerCase()}
var S={entries:[
 {id:1,type:'voice',text:'Product roadmap thoughts for the sync feature',t:at(22,14),dur:42,pts:['Move search to the device','Ship offline mode first','Talk to two users this week']},
 {id:2,type:'meal',text:'Salmon bowl with brown rice and greens',t:at(19,30),kcal:640},
 {id:3,type:'note',text:'Dieter Rams’ principles on unobtrusive tools: good design is as little design as possible.',t:at(14,15)},
 {id:4,type:'meal',text:'Chicken wrap and salad',t:at(13,20),kcal:680},
 {id:5,type:'meal',text:'Oats with banana',t:at(8,30),kcal:520}],
 habits:[['Read 20 minutes',1],['Workout',0],['Drink 2L water',1],['Meditate',0]],tab:'home'};
try{var s=localStorage.getItem('hashi');if(s){S=JSON.parse(s)}}catch(e){}
function save(){try{localStorage.setItem('hashi',JSON.stringify(S))}catch(e){}}
var TABS=[['home','Home','home'],['ideas','Ideas','bulb'],['health','Health','pulse'],['journal','Journal','book']];
var TT={home:'Good evening',ideas:'Ideas',health:'Health',journal:'Journal'};
var $=function(s){return document.querySelector(s)};
var ICON={voice:'mic',meal:'cam',note:'pen'};
function kcal(){return S.entries.filter(function(e){return e.type==='meal'}).reduce(function(a,e){return a+(e.kcal||0)},0)}
function streak(){return 14+(S.habits.every(function(h){return h[1]})?1:0)}
function rowH(e){return '<div class="row" data-id="'+e.id+'"><span class="ic">'+ic(ICON[e.type],18)+'</span><p>'+esc(e.text)+'</p><span class="mono">'+fmt(e.t)+'</span></div>'}
function nav(){$('#nav').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+ic(t[2])+t[1]+'</button>'}).join('')}
function view(){
 var h='',es=S.entries.slice().sort(function(a,b){return b.t-a.t});
 $('#ttl').textContent=TT[S.tab];
 if(S.tab==='home'){
  h='<div class="grid"><button class="tile p" data-c="meal">'+ic('cam',28)+'Meal</button><button class="tile" data-c="voice">'+ic('mic',28)+'Voice</button><button class="tile" data-c="note">'+ic('pen',28)+'Note</button><button class="tile" data-c="habit">'+ic('chk',28)+'Habit</button></div>'
  +'<p class="today">'+kcal().toLocaleString()+' kcal · 8,420 steps · '+streak()+' day streak</p><p class="lbl">Recent</p><div class="list">'+es.slice(0,3).map(rowH).join('')+'</div>';
 }else if(S.tab==='ideas'){
  var n=es.filter(function(e){return e.type==='note'});
  h=(n.length?'<div class="list">'+n.map(rowH).join('')+'</div>':'<p class="empty">No ideas yet.</p>')+'<button class="fab" data-c="note">+ New idea</button>';
 }else if(S.tab==='health'){
  var k=kcal(),pct=Math.min(100,k/2200*100);
  h='<div class="card"><div class="lbl" style="margin-left:0">Calories</div><div class="big">'+k.toLocaleString()+' <span style="font-size:15px;color:var(--mu);font-weight:400">of 2,200</span></div><div class="bar"><i style="width:'+pct+'%"></i></div><span class="mono">Protein 112g · Carbs 190g · Fat 58g</span></div>'
  +'<div class="two"><div class="card"><div class="lbl" style="margin-left:0">Steps</div><div class="big">8,420</div></div><div class="card"><div class="lbl" style="margin-left:0">Sleep</div><div class="big">7h 15m</div></div></div>'
  +'<div class="card" style="padding-top:8px;padding-bottom:8px">'+S.habits.map(function(x,i){return '<button class="chk '+(x[1]?'d':'')+'" data-h="'+i+'"><span class="box">'+(x[1]?ic('chk',14):'')+'</span><span>'+x[0]+'</span></button>'}).join('')+'</div>';
 }else{
  var v=es.filter(function(e){return e.type==='voice'});
  h=v.length?v.map(function(e){return '<div class="card"><div style="display:flex;justify-content:space-between"><span>'+esc(e.text)+'</span><span class="mono">'+fmt(e.t)+'</span></div><div class="aud"><button class="play" data-p="'+e.id+'">'+ic('play',14)+'</button><div class="bar"><i style="width:0%" id="b'+e.id+'"></i></div><span class="mono">0:'+String(e.dur).padStart(2,'0')+'</span></div>'+(e.pts?'<ul class="tk">'+e.pts.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul>':'')+'</div>'}).join(''):'<p class="empty">No voice notes yet.</p>';
  h+='<button class="fab" data-c="voice">+ Record</button>';
 }
 $('#view').innerHTML=h;nav();
}
// capture screens
var rt=null;
function sheet(kind){
 var el=document.createElement('div');el.className='sheet';el.id='sh';
 var t={meal:'Meal',voice:'Voice note',note:'Note',habit:'Habits'}[kind],b='';
 if(kind==='meal')b='<div class="photo" id="ph">Tap to add a photo</div><input type="file" accept="image/*" capture="environment" id="fi" hidden><input id="nm" placeholder="What did you eat?"><input id="kc" type="number" inputmode="numeric" placeholder="Calories (optional)"><button class="go" data-s="meal">Save meal</button>';
 if(kind==='note')b='<textarea id="tx" placeholder="What’s on your mind?"></textarea><button class="go" data-s="note">Save</button>';
 if(kind==='voice')b='<div class="timer" id="tm">0:00</div><div class="bar" style="margin:24px 0"><i id="rb" style="width:0%"></i></div><button class="rec" id="rc">'+ic('mic',36)+'</button><p class="mono" style="text-align:center" id="hint">Tap to start · 60s max</p><div style="height:40px"></div>';
 if(kind==='habit')b='<div class="card" style="padding-top:8px;padding-bottom:8px">'+S.habits.map(function(x,i){return '<button class="chk '+(x[1]?'d':'')+'" data-h="'+i+'"><span class="box">'+(x[1]?ic('chk',14):'')+'</span><span>'+x[0]+'</span></button>'}).join('')+'</div><button class="go" data-s="close">Done</button>';
 el.innerHTML='<div class="top"><h1>'+t+'</h1><button data-s="close" aria-label="Close">'+ic('x')+'</button></div>'+b;
 $('#app').appendChild(el);
 if(kind==='meal'){$('#ph').onclick=function(){$('#fi').click()};$('#fi').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('#ph').innerHTML='<img src="'+r.result+'" alt="">'};r.readAsDataURL(f)}}
 if(kind==='voice'){var sec=0;$('#rc').onclick=function(){if(rt){stopRec(sec);return}
  $('#rc').classList.add('on');$('#rc').innerHTML=ic('stop',30);$('#hint').textContent='Tap to stop';
  rt=setInterval(function(){sec++;$('#tm').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('#rb').style.width=sec/60*100+'%';if(sec>=60)stopRec(sec)},1000)}}
}
function stopRec(sec){clearInterval(rt);rt=null;add({type:'voice',text:'Voice note',dur:sec||1});closeS()}
function closeS(){if(rt){clearInterval(rt);rt=null}var s=$('#sh');if(s)s.remove();view()}
function add(o){o.id=Date.now();o.t=Date.now();S.entries.push(o);save()}
document.addEventListener('click',function(ev){
 var x=ev.target.closest('[data-c],[data-t],[data-s],[data-h],[data-p],.row');if(!x)return;
 var d=x.dataset;
 if(d.t){S.tab=d.t;save();view()}
 else if(d.c)sheet(d.c);
 else if(d.h!==undefined){var i=+d.h;S.habits[i][1]=S.habits[i][1]?0:1;save();var wasSheet=!!$('#sh');var scroll=$('#view').scrollTop;if(wasSheet){$('#sh').remove();sheet('habit')}view();$('#view').scrollTop=scroll}
 else if(d.s==='close')closeS();
 else if(d.s==='meal'){var nm=$('#nm').value.trim()||'Meal';add({type:'meal',text:nm,kcal:+$('#kc').value||0});closeS()}
 else if(d.s==='note'){var tx=$('#tx').value.trim();if(!tx)return;add({type:'note',text:tx});closeS()}
 else if(d.p){var bar=$('#b'+d.p),btn=x,e=S.entries.filter(function(q){return q.id==d.p})[0];
  if(btn._t){clearInterval(btn._t);btn._t=null;btn.innerHTML=ic('play',14);return}
  var s=0;btn.innerHTML=ic('pause',14);btn._t=setInterval(function(){s++;bar.style.width=Math.min(100,s/e.dur*100)+'%';if(s>=e.dur){clearInterval(btn._t);btn._t=null;btn.innerHTML=ic('play',14);bar.style.width='0%'}},1000)}
 else if(x.classList.contains('row'))x.classList.toggle('open');
});
$('#av').innerHTML=ic('user',18);
view();
</script>
</body>
</html>
